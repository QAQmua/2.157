name: Build Pure Native iOS 26 IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write 

    steps:
      - name: 1. 检出代码
        uses: actions/checkout@v4

      - name: 2. 规整最新工程目录
        run: |
          find . -maxdepth 2 -iname "*.zip" -exec unzip -o -q "{}" \;

          TARGET_DIR=""
          while IFS= read -r pkg_file; do
            DIR=$(dirname "$pkg_file")
            if [ -z "$TARGET_DIR" ] || [ "$pkg_file" -nt "$TARGET_DIR/Package.swift" ]; then
              TARGET_DIR="$DIR"
            fi
          done < <(find . -name "Package.swift" -not -path "*/.*")

          if [ -z "$TARGET_DIR" ]; then
            echo "❌ 未找到 Package.swift 目录"
            exit 1
          fi
          echo "✅ 锁定原始工程目录: $TARGET_DIR"
          
          rm -rf AppSource
          mv "$TARGET_DIR" AppSource

      - name: 3. 编译并封装纯正原生 iOS 26 IPA (0% AI 干预)
        run: |
          cd AppSource
          SCHEME=$(xcodebuild -list 2>/dev/null | awk '/Schemes:/{flag=1;next} flag && NF{print $1; exit}')
          if [ -z "$SCHEME" ]; then SCHEME="幼刀"; fi
          echo "🚀 正在编译原生 Scheme: $SCHEME"

          set +e
          xcodebuild build \
            -scheme "$SCHEME" \
            -destination "generic/platform=iOS" \
            -configuration Release \
            -derivedDataPath ./build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" > build.log 2>&1
          
          BUILD_STATUS=$?
          if [ $BUILD_STATUS -ne 0 ]; then
            echo "==================== [ 编译错误详情 ] ===================="
            grep -E "error:" build.log | head -n 30
            echo "=========================================================="
            exit $BUILD_STATUS
          fi
          set -e

          PRODUCTS_DIR=$(find ./build -type d -path "*/Build/Products/Release-iphoneos" | head -n 1)
          echo "✅ 产物目录: $PRODUCTS_DIR"

          mkdir -p Payload/YouDao.app

          # 1. 拷贝二进制主程序
          APP_BIN=$(find "$PRODUCTS_DIR" -maxdepth 1 -type f -perm +111 ! -name "*.*" ! -name ".*" | head -n 1)
          if [ -z "$APP_BIN" ]; then
            APP_BIN=$(find "$PRODUCTS_DIR" -name "幼刀" -o -name "AppModule" | head -n 1)
          fi
          echo "✅ 锁定可执行文件: $APP_BIN"
          cp "$APP_BIN" Payload/YouDao.app/YouDao
          chmod +x Payload/YouDao.app/YouDao

          # 2. 拷贝资源 Bundle
          find "$PRODUCTS_DIR" -maxdepth 1 -type d -name "*.bundle" | while read -r bndl; do
            cp -R "$bndl/"* Payload/YouDao.app/ 2>/dev/null || true
          done

          # 3. 编译应用图标与资源库
          ASSETS_DIR=$(find . -maxdepth 2 -name "Assets.xcassets" | head -n 1)
          if [ -n "$ASSETS_DIR" ]; then
            echo "🎨 正在编译素材库: $ASSETS_DIR"
            xcrun actool "$ASSETS_DIR" \
              --compile Payload/YouDao.app \
              --platform iphoneos \
              --minimum-deployment-target 18.0 \
              --app-icon AppIcon \
              --output-partial-info-plist partial_assetcatalog.plist || true
          fi

          # 4. 生成原生全面屏 Info.plist
          python3 -c '
          plist_content = """<?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>zh_CN</string>
              <key>CFBundleDisplayName</key>
              <string>幼刀</string>
              <key>CFBundleExecutable</key>
              <string>YouDao</string>
              <key>CFBundleIdentifier</key>
              <string>com.kunoouc.youdao</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundleName</key>
              <string>幼刀</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>MinimumOSVersion</key>
              <string>17.0</string>
              <key>UIDeviceFamily</key>
              <array>
                  <integer>1</integer>
                  <integer>2</integer>
              </array>
              <key>UILaunchScreen</key>
              <dict>
                  <key>UIColorName</key>
                  <string></string>
              </dict>
              <key>UIRequiredDeviceCapabilities</key>
              <array>
                  <string>arm64</string>
              </array>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
                  <string>UIInterfaceOrientationLandscapeLeft</string>
                  <string>UIInterfaceOrientationLandscapeRight</string>
              </array>
              <key>UISupportedInterfaceOrientations~ipad</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
                  <string>UIInterfaceOrientationPortraitUpsideDown</string>
                  <string>UIInterfaceOrientationLandscapeLeft</string>
                  <string>UIInterfaceOrientationLandscapeRight</string>
              </array>
              <key>NSPhotoLibraryUsageDescription</key>
              <string>需要访问您的相册以自定义桌面壁纸、小组件配图与聊天头像</string>
          </dict>
          </plist>
          """
          with open("Payload/YouDao.app/Info.plist", "w") as f:
              f.write(plist_content)
          '

          if [ -f "partial_assetcatalog.plist" ]; then
            /usr/libexec/PlistBuddy -x -c "Merge partial_assetcatalog.plist" Payload/YouDao.app/Info.plist || true
          fi

          plutil -convert binary1 Payload/YouDao.app/Info.plist

          # 5. 打包输出 IPA
          zip -qry YouDao.ipa Payload
          mv YouDao.ipa "$GITHUB_WORKSPACE/YouDao.ipa"
          echo "🎉 原生 iOS 26 IPA 打包完成！"

      - name: 4. 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "幼刀 原生 iOS 26 IPA (Build ${{ github.run_number }})"
          files: YouDao.ipa
          token: ${{ secrets.GITHUB_TOKEN }}
